<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
  <title id="title">Caption-first transcript flow</title>
  <desc id="desc">Check YouTube for a matching original-language caption track. Preserve it when available; otherwise use local speech recognition if configured. Both paths write a VTT and provenance JSON.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#101b33"/><stop offset="1" stop-color="#172644"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#60d7c0"/><stop offset="1" stop-color="#8c9eff"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#8c9eff"/></marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { fill: #f4f7ff; font-size: 16px; font-weight: 700; }
      .copy { fill: #bdc9df; font-size: 12px; }
      .label { fill: #79e0ca; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; }
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="348" rx="22" fill="url(#bg)" stroke="#30415f" stroke-width="2"/>
  <text x="34" y="42" class="label">PRESERVE YOUTUBE CAPTIONS FIRST · LOCAL FALLBACK ONLY WHEN NEEDED</text>

  <g transform="translate(30 116)">
    <rect width="230" height="145" rx="16" fill="#1d2b48" stroke="#405576"/>
    <circle cx="35" cy="35" r="15" fill="#304668"/>
    <path d="M29 26h12a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5h-4l-6 5v-5h-2a5 5 0 0 1-5-5v-8a5 5 0 0 1 5-5z" fill="none" stroke="#8c9eff" stroke-width="2" stroke-linejoin="round"/>
    <text x="22" y="78" class="title">Check the video</text>
    <text x="22" y="103" class="copy">Look for a track in the</text>
    <text x="22" y="121" class="copy">requested original language.</text>
  </g>

  <path d="M264 188h36" stroke="url(#accent)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="m345 142 46 46-46 46-46-46z" fill="#202f4c" stroke="#62749c" stroke-width="2"/>
  <text x="345" y="184" text-anchor="middle" fill="#f4f7ff" font-size="11" font-weight="700">Match?</text>

  <path d="M391 188h26v-67h32" fill="none" stroke="#60d7c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="397" y="108" class="label">YES</text>
  <path d="M391 188h26v67h32" fill="none" stroke="#c4a8ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="397" y="277" fill="#c4a8ff" font-size="10" font-weight="700" letter-spacing="1.2">NO</text>

  <g transform="translate(455 74)">
    <rect width="285" height="96" rx="15" fill="#1d2b48" stroke="#405576"/>
    <circle cx="31" cy="31" r="13" fill="#244b4b"/>
    <path d="M25 25h12v14H25zM28 22h6M28 30h6M28 34h6" fill="none" stroke="#60d7c0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="36" class="title">Save original captions</text>
    <text x="22" y="67" class="copy">Preserve YouTube's timestamps and wording.</text>
  </g>

  <g transform="translate(455 208)">
    <rect width="285" height="96" rx="15" fill="#1d2b48" stroke="#405576"/>
    <circle cx="31" cy="31" r="13" fill="#3a3453"/>
    <path d="M24 33v-3a7 7 0 0 1 14 0v3M24 33h4v7h-4zM34 33h4v7h-4zM30 42h5" fill="none" stroke="#c4a8ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="36" class="title">Use local Whisper</text>
    <text x="22" y="67" class="copy">Only when local tools and a model are ready.</text>
  </g>

  <path d="M740 122h36v66h34" fill="none" stroke="#60d7c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M740 256h36v-68h34" fill="none" stroke="#c4a8ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(812 116)">
    <rect width="278" height="145" rx="16" fill="#1d2b48" stroke="#405576"/>
    <text x="22" y="42" class="label">OUTPUT</text>
    <text x="22" y="75" class="title">Timestamped VTT</text>
    <text x="22" y="100" class="title">+ provenance JSON</text>
    <text x="22" y="125" class="copy">Audio and transcripts stay local.</text>
  </g>
</svg>
