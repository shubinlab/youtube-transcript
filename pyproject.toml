[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-transcript-local"
version = "0.2.0"
description = "Local-first YouTube captions with an optional whisper.cpp fallback"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shubin Lab" }]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = ["yt-dlp[default]"]

[project.optional-dependencies]
js-runtime = ["deno>=2.3"]

[project.scripts]
youtube-transcript = "youtube_transcript:main"

[project.urls]
Homepage = "https://github.com/shubinlab/youtube-transcript"
Repository = "https://github.com/shubinlab/youtube-transcript"
Issues = "https://github.com/shubinlab/youtube-transcript/issues"

[tool.setuptools]
py-modules = ["youtube_transcript"]
include-package-data = false
