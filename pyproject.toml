[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-transcript-local"
version = "0.1.0"
description = "Local-first YouTube captions with an optional whisper.cpp fallback"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shubin Lab" }]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
youtube-transcript = "youtube_transcript:main"

[project.urls]
Homepage = "https://github.com/shubinlab/youtube-transcript"
Repository = "https://github.com/shubinlab/youtube-transcript"
Issues = "https://github.com/shubinlab/youtube-transcript/issues"

[tool.setuptools]
py-modules = ["youtube_transcript"]
include-package-data = false
